<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#13110f">
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#13110f; --panel:#1c1916; --panel-2:#231f1b;
    --line:#322c26; --ink:#efe9e0; --ink-dim:#a89e90; --ink-faint:#6f665b;
    --accent:#e0a45e; --accent-soft:#c98a44; --event:#6fa8a0; --new:#e0a45e;
    --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);font-family:"Spline Sans Mono",ui-monospace,monospace}
  body{
    min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background-image:radial-gradient(120% 80% at 50% -10%, #211c17 0%, var(--bg) 60%);
  }
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 90px}

  header{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 16px}
  h1{font-family:"Fraunces",serif;font-weight:600;font-size:30px;letter-spacing:-.01em}
  .stamp{font-size:11px;color:var(--ink-faint);letter-spacing:.04em}

  /* tabs */
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none;position:sticky;top:0;
        background:linear-gradient(var(--bg) 70%, transparent);z-index:5}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;position:relative;border:1px solid var(--line);background:var(--panel);
       color:var(--ink-dim);padding:9px 14px;border-radius:999px;font-size:13px;letter-spacing:.01em;
       cursor:pointer;transition:.18s;white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--ink);color:#1a1714;border-color:var(--ink);font-weight:500}
  .tab .dot{position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;
            background:var(--new);box-shadow:0 0 0 3px var(--panel)}
  .tab[aria-selected="true"] .dot{box-shadow:0 0 0 3px var(--ink)}

  /* list */
  .list{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .empty{color:var(--ink-faint);text-align:center;padding:48px 0;font-size:13px;line-height:1.6}
  .item{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
        padding:14px 15px 14px 17px;overflow:hidden;animation:rise .35s both}
  .item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  .item.event::before{background:var(--event)}
  .item .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .title{font-size:14.5px;line-height:1.4;color:var(--ink);letter-spacing:.005em}
  .meta{display:flex;gap:10px;align-items:center;margin-top:9px;font-size:11px;color:var(--ink-faint)}
  .pill{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;
        border:1px solid var(--line);color:var(--ink-dim)}
  .pill.event{color:var(--event);border-color:#2f4845}
  .when{color:var(--ink-dim)}
  .when.soon{color:var(--accent)}
  .when.past{color:#c96b5e}
  .src{color:var(--ink-faint);font-size:11px;margin-top:7px;display:flex;gap:6px;align-items:center}
  .src::before{content:"↳";color:var(--ink-faint)}
  .rank{font-family:"Fraunces",serif;font-size:13px;color:var(--ink-faint);min-width:20px;text-align:right;padding-top:1px}

  /* action circles (pin / done) */
  .actions{display:flex;flex-direction:column;gap:8px;align-items:center;flex:0 0 auto}
  .circle{width:27px;height:27px;border-radius:50%;border:1.5px solid var(--line);background:none;
          color:var(--ink-faint);font-size:13px;line-height:1;cursor:pointer;padding:0;
          display:flex;align-items:center;justify-content:center;transition:.15s;font-family:inherit}
  .circle:active{transform:scale(.88)}
  .circle.pin.on{border-color:var(--accent);color:var(--accent);background:rgba(224,164,94,.14)}
  .item.pinned{border-color:#6b5232}
  .item.done-pending{opacity:.45}
  .item.done-pending .title{text-decoration:line-through}

  /* undo snackbar */
  #undo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(54px + env(safe-area-inset-bottom));
        background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:999px;
        padding:9px 8px 9px 16px;font-size:12.5px;display:none;align-items:center;gap:10px;z-index:20;
        box-shadow:0 6px 24px rgba(0,0,0,.5);white-space:nowrap}
  #undo button{background:var(--ink);color:#1a1714;border:none;border-radius:999px;padding:6px 12px;
        font-family:inherit;font-size:12px;font-weight:500;cursor:pointer}

  /* this-week grouping */
  .group-label{font-family:"Fraunces",serif;font-size:12px;color:var(--ink-faint);letter-spacing:.06em;
               text-transform:uppercase;margin:18px 4px 4px}
  .wf-tag{font-size:10px;color:var(--ink-faint);letter-spacing:.04em}

  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* referral cards */
  .ref{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
       padding:14px 15px;cursor:pointer;animation:rise .35s both;transition:.15s}
  .ref::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--event);border-radius:var(--r) 0 0 var(--r)}
  .ref:active{transform:scale(.99)}
  .ref .name{font-family:"Fraunces",serif;font-size:16px;color:var(--ink);letter-spacing:.005em}
  .ref .proc{font-size:12.5px;color:var(--ink-dim);line-height:1.45;margin-top:4px}
  .ref .rmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:11px;color:var(--ink-faint)}
  .ref .chev{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:16px}

  /* referral detail modal */
  #sheet{position:fixed;inset:0;z-index:30;display:none}
  #sheet.open{display:block}
  #sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .2s both}
  #sheet .card{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;
       max-height:88vh;overflow-y:auto;background:var(--panel-2);border:1px solid var(--line);
       border-radius:18px 18px 0 0;padding:20px 18px calc(26px + env(safe-area-inset-bottom));
       animation:slideUp .26s cubic-bezier(.2,.8,.2,1) both}
  #sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
  #sheet .shead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
  #sheet .sname{font-family:"Fraunces",serif;font-size:23px;font-weight:600;color:var(--ink);line-height:1.15}
  #sheet .sclose{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
       background:none;color:var(--ink-dim);font-size:16px;cursor:pointer;font-family:inherit}
  #sheet .sproc{font-size:13px;color:var(--accent);line-height:1.5;margin:6px 0 16px}
  #sheet .vitals{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  #sheet .vital{flex:1 1 0;min-width:84px;background:var(--panel);border:1px solid var(--line);
       border-radius:10px;padding:9px 11px}
  #sheet .vital .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}
  #sheet .vital .v{font-size:15px;color:var(--ink);margin-top:3px;font-family:"Fraunces",serif}
  #sheet .field{border-top:1px solid var(--line);padding:13px 2px 0;margin-top:13px}
  #sheet .field .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px}
  #sheet .field .v{font-size:14px;color:var(--ink);line-height:1.55;white-space:pre-wrap}
  #sheet .field .v.warn{color:#e6b07a}
  #sheet .ssrc{margin-top:18px;font-size:11px;color:var(--ink-faint);display:flex;gap:6px;align-items:center}
  #sheet .ssrc::before{content:"↳"}
#sheet .smsblock{border-top:1px solid var(--line);padding:13px 2px 0;margin-top:13px}
#sheet .smsblock .khead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#sheet .smsblock .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}
#sheet .smscopy{background:var(--accent);color:#1a1714;border:none;border-radius:999px;padding:5px 12px;
font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.02em}
#sheet .smscopy:active{transform:scale(.94)}
#sheet .smsblock .v{font-size:13.5px;color:var(--ink);line-height:1.55;white-space:pre-wrap;
background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}

  .bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;
       padding:10px 0 calc(10px + env(safe-area-inset-bottom));
       background:linear-gradient(transparent, var(--bg) 40%);font-size:11px;color:var(--ink-faint)}
  .refresh{background:none;border:1px solid var(--line);color:var(--ink-dim);border-radius:999px;
           padding:6px 13px;font-family:inherit;font-size:11px;cursor:pointer}
  .err{color:#c96b5e;font-size:11px;text-align:center;padding:6px}

  /* login */
  #login{display:none;flex-direction:column;gap:12px;max-width:320px;margin:64px auto 0;text-align:center}
  #login h2{font-family:"Fraunces",serif;font-weight:600;font-size:26px}
  #login p{color:var(--ink-dim);font-size:12.5px;line-height:1.6}
  #login input{background:var(--panel);border:1px solid var(--line);color:var(--ink);
       border-radius:10px;padding:12px 14px;font-family:inherit;font-size:15px;text-align:center;letter-spacing:.02em;width:100%}
  #login input.code{letter-spacing:8px;font-size:22px}
  #login button.primary{background:var(--ink);color:#1a1714;border:none;border-radius:999px;
       padding:11px 14px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer}
  #login button.primary:disabled{opacity:.5}
  #login .linkbtn{background:none;border:none;color:var(--ink-faint);font-size:11px;cursor:pointer;text-decoration:underline}
  #login .msg{font-size:11.5px;min-height:15px;color:var(--ink-dim)}
  #login .msg.bad{color:#c96b5e}
  #login .msg.ok{color:var(--event)}
  #setpw{display:none;flex-direction:column;gap:12px;max-width:320px;margin:64px auto 0;text-align:center}
  #setpw h2{font-family:"Fraunces",serif;font-weight:600;font-size:26px}
  #setpw p{color:var(--ink-dim);font-size:12.5px;line-height:1.6}
  #setpw input{background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:12px 14px;font-size:15px;outline:none}
  #setpw button.primary{background:var(--ink);color:#1a1714;border:none;border-radius:999px;
    padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer}
  #setpw button.primary:disabled{opacity:.5}
  #setpw .msg{font-size:11.5px;min-height:15px;color:var(--ink-dim)}
  #setpw .msg.bad{color:#c96b5e}
  #setpw .msg.ok{color:var(--event)}
  /* sub-tabs inside a project (Tasks / Brief / Timeline) */
  .subtabs{display:none;gap:0;margin:0 2px 10px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}
  .subtab{flex:1 1 0;background:none;border:none;border-right:1px solid var(--line);color:var(--ink-dim);
          padding:9px 4px;font-family:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .subtab:last-child{border-right:none}
  .subtab[aria-selected="true"]{background:var(--panel-2);color:var(--ink);font-weight:500;box-shadow:inset 0 -2px 0 var(--accent)}
  .subtab .n{color:var(--ink-faint);font-size:11px;margin-left:3px}

  /* brief */
  .bsec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;animation:rise .35s both}
  .bsec h3{font-family:"Fraunces",serif;font-weight:500;font-size:12px;letter-spacing:.07em;text-transform:uppercase;
           color:var(--ink-faint);margin-bottom:8px}
  .bsec p{font-size:14px;line-height:1.55;color:var(--ink)}
  .bsec ol{margin:0 0 0 20px;font-size:14px;line-height:1.5}
  .bsec ol li{margin:3px 0;padding-left:2px}
  .bsec .none{color:var(--ink-faint);font-size:13px}
  .bsec .count{margin-top:8px;font-size:12.5px;color:var(--event)}
  .brow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
  .brow:first-of-type{border-top:none;padding-top:0}
  .brow:last-child{padding-bottom:0}
  .brow .who{font-size:14px;color:var(--ink);line-height:1.4}
  .brow .what{font-size:12.5px;color:var(--ink-dim);line-height:1.45;margin-top:2px}
  .brow .since{font-size:11px;color:var(--ink-faint);margin-top:4px}
  .brow .since.chase{color:#c96b5e}
  .chasetag{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:6px;
            border:1px solid #6b3a33;color:#e08a7c;margin-left:6px}
  .drow{display:flex;gap:12px;font-size:13px;line-height:1.45;padding:4px 0}
  .drow .d{flex:0 0 58px;color:var(--accent);font-size:12px;padding-top:1px}
  .drow .t{color:var(--ink)}
  .bsec.meeting{border-color:#6b5232;background:linear-gradient(180deg,rgba(224,164,94,.09),var(--panel) 70%)}
  .bsec.meeting h3{color:var(--accent)}
  .bsec.meeting .mtitle{font-family:"Fraunces",serif;font-size:17px;line-height:1.3;margin-bottom:3px}
  .bsec.meeting .mwhen{font-size:12px;color:var(--ink-dim);margin-bottom:10px}
  .bsec.meeting h4{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);font-weight:400;margin:11px 0 5px}
  .bsec.meeting ul{margin:0 0 0 17px;font-size:13.5px;line-height:1.5}
  .bsec.meeting .qa{font-size:13.5px;line-height:1.5;margin:6px 0}
  .bsec.meeting .qa .q{color:var(--ink-dim)}
  .bsec.meeting .notes{font-size:13.5px;line-height:1.5;white-space:pre-wrap}
  .updated{font-size:11px;color:var(--ink-faint);text-align:center;margin-top:4px}
  .updated.stale{color:#c96b5e}

  /* timeline */
  .tl{position:relative;display:flex;gap:12px;padding:7px 4px 7px 2px}
  .tl .d{flex:0 0 50px;font-size:11.5px;color:var(--ink-faint);text-align:right;padding-top:2px;white-space:nowrap}
  .tl .b{flex:1 1 auto;border-left:1px solid var(--line);padding-left:13px;position:relative}
  .tl .b::before{content:"";position:absolute;left:-4px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--line)}
  .tl .t{font-size:13.5px;line-height:1.42;color:var(--ink-dim)}
  .tl .s{font-size:10.5px;color:var(--ink-faint);margin-top:2px}
  .tl.up .t{color:var(--ink)}
  .tl.up .d{color:var(--accent)}
  .tl.up .b::before{background:var(--accent)}
  .tl.k-meeting .b::before{background:var(--event)}
  .tl.k-bill .b::before,.tl.over .b::before{background:#c96b5e}
  .tl.over .d{color:#c96b5e}
  .tl .tag{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);
           border-radius:5px;padding:1px 5px;margin-left:6px;white-space:nowrap}
  .todayline{display:flex;align-items:center;gap:10px;margin:10px 2px;color:var(--accent);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .todayline::before,.todayline::after{content:"";flex:1 1 auto;height:1px;background:var(--accent);opacity:.55}
  .list.tight{gap:0}
  .list.tight .group-label{margin:16px 4px 6px}
  .item.info{cursor:pointer}
  .item.info::before{background:var(--event)}
  .item.chase::before{background:#c96b5e}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ledger</h1>
    <span class="stamp" id="stamp"></span>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <nav class="subtabs" id="subtabs" role="tablist"></nav>
  <main class="list" id="list" aria-live="polite"></main>
  <div class="err" id="err"></div>
  <div id="login">
    <h2>Ledger</h2>
    <p id="login-step1-text">Sign in to view your tasks.</p>
    <input id="login-email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com">
    <input id="login-password" type="password" autocomplete="current-password" placeholder="Password">
    <button id="sign-in" class="primary">Sign in</button>
    <div class="msg" id="login-msg"></div>
  </div>
  <div id="setpw">
    <h2>Set a password</h2>
    <p>Choose a password for future sign-ins to Ledger. Minimum 8 characters.</p>
    <input id="setpw1" type="password" autocomplete="new-password" placeholder="New password">
    <input id="setpw2" type="password" autocomplete="new-password" placeholder="Confirm password">
    <button id="setpw-go" class="primary">Save password</button>
    <div class="msg" id="setpw-msg"></div>
  </div>
</div>
<div id="sheet" aria-hidden="true">
  <div class="scrim" id="sheet-scrim"></div>
  <div class="card" role="dialog" aria-modal="true" aria-label="Referral details">
    <div class="grab"></div>
    <div id="sheet-body"></div>
  </div>
</div>
<div id="undo"><span id="undo-text"></span><button id="undo-btn">Undo</button></div>
<div class="bar">
  <span id="status">signed in</span>
  <button class="refresh" id="refresh">refresh</button>
  <button class="refresh" id="signout">sign out</button>
</div>

<script>
/* ============================================================
   Ledger web app. One file, hosted on GitHub Pages.
   Data lives in Supabase; nothing is readable without signing in.
   The key below is the PUBLISHABLE key (safe to be public).
   ============================================================ */
const SUPABASE_URL  = "https://kurgccxdccjbkaxugepw.supabase.co";
const SUPABASE_ANON = "sb_publishable_8qUHVSNBWLHl9wwIPD70Sw_6I2ZoUnD";

/* Five project tabs. Each groups one or more to-do domains (the `workflow`
   table keeps the old domain names, so the skills that add to-dos are unchanged).
   The Personal domain is deliberately not listed: Ledger is for work only. */
const PROJECTS=[
  {id:"insafe",   name:"InSafe",            wf:["insafe"]},
  {id:"prospect", name:"Prospect Hospital", wf:["prospect"]},
  {id:"research", name:"Research",          wf:["research"]},
  {id:"work",     name:"Work",              wf:["advanced-anaes","public-anaes","nitrous","sustainability"]},
  {id:"finances", name:"Finances",          wf:["finances","income-tax","invoices"]},
];
const WF_PROJECT={}; PROJECTS.forEach(p=>p.wf.forEach(w=>WF_PROJECT[w]=p.id));
const CHASE_DAYS=7;     // a "waiting on" item this old shows in This Week as "chase"
const STALE_DAYS=14;    // a brief older than this is flagged as possibly out of date
const LS_KEY="ledger:lastSeen2";   // per-project last-viewed timestamps
const AGENDA="__week__";
const MOCKMODE=new URLSearchParams(location.search).has("mock");   // layout test with made-up data, no sign-in

let DATA={workflows:[],items:[],referrals:[],briefs:[],waiting:[],timeline:[]};
let active=null;        // AGENDA or a project id
let sub="tasks";        // tasks | brief | timeline | patients

function setAppVisible(on){
  el("tabs").style.display=on?"":"none";
  el("list").style.display=on?"":"none";
  el("subtabs").style.display=(on&&active&&active!==AGENDA)?"flex":"none";
}

/* ---- auth: email + password ---- */
const SESS_KEY="ledger:session";
function el(id){return document.getElementById(id);}
function getSession(){try{return JSON.parse(localStorage.getItem(SESS_KEY))}catch{return null}}
function setSession(s){ s?localStorage.setItem(SESS_KEY,JSON.stringify(s)):localStorage.removeItem(SESS_KEY); }
function saveAuth(d){
  const now=Math.floor(Date.now()/1000);
  setSession({access_token:d.access_token,refresh_token:d.refresh_token,
              expires_at:d.expires_at||(now+(d.expires_in||3600))});
}
async function validToken(){
  const s=getSession(); if(!s||!s.access_token) return null;
  const now=Math.floor(Date.now()/1000);
  if(s.expires_at && s.expires_at-60>now) return s.access_token;   // still valid
  if(s.refresh_token){                                             // try silent refresh
    try{
      const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,
        {method:"POST",headers:{apikey:SUPABASE_ANON,"Content-Type":"application/json"},
         body:JSON.stringify({refresh_token:s.refresh_token})});
      if(r.ok){const d=await r.json(); saveAuth(d); return d.access_token;}
    }catch(e){}
  }
  setSession(null); return null;
}

async function signIn(){
  const email=el("login-email").value.trim();
  const password=el("login-password").value;
  const msg=el("login-msg"); msg.className="msg";
  if(!email||!password){msg.className="msg bad";msg.textContent="Enter your email and password.";return;}
  el("sign-in").disabled=true; msg.textContent="Signing in…";
  try{
    const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,
      {method:"POST",headers:{apikey:SUPABASE_ANON,"Content-Type":"application/json"},
       body:JSON.stringify({email,password})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.access_token) throw new Error(d.msg||d.error_description||("HTTP "+r.status));
    saveAuth(d); resetLoginUI(); hideLogin(); load();
  }catch(e){ msg.className="msg bad"; msg.textContent="Sign-in failed: "+e.message; el("sign-in").disabled=false; }

function setPassword(accessToken){
  return new Promise(function(resolve){
    showSetPw();
    const msg=el("setpw-msg");
    el("setpw-go").onclick=async function(){
      const a=el("setpw1").value, b=el("setpw2").value; msg.className="msg";
      if(a.length<8){msg.className="msg bad";msg.textContent="At least 8 characters.";return;}
      if(a!==b){msg.className="msg bad";msg.textContent="Passwords do not match.";return;}
      el("setpw-go").disabled=true; msg.textContent="Saving…";
      try{
        const r=await fetch(`${SUPABASE_URL}/auth/v1/user`,
          {method:"PUT",headers:{apikey:SUPABASE_ANON,Authorization:"Bearer "+accessToken,"Content-Type":"application/json"},
           body:JSON.stringify({password:a})});
        const d=await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(d.msg||d.error_description||("HTTP "+r.status));
        el("setpw1").value=""; el("setpw2").value="";
        el("setpw").style.display="none"; resolve(true);
      }catch(e){ msg.className="msg bad"; msg.textContent="Couldn't save: "+e.message; el("setpw-go").disabled=false; }
    };
  });
}
async function processAuthHash(){
  if(!location.hash || location.hash.indexOf("access_token")<0) return;
  const p=new URLSearchParams(location.hash.slice(1));
  const at=p.get("access_token"), rt=p.get("refresh_token");
  const isRecovery=p.get("type")==="recovery";
  if(at){
    const now=Math.floor(Date.now()/1000);
    setSession({access_token:at,refresh_token:rt,
      expires_at:parseInt(p.get("expires_at")||"0",10)||(now+parseInt(p.get("expires_in")||"3600",10))});
    history.replaceState(null,"",location.pathname+location.search);
    if(isRecovery) await setPassword(at);
  }
}

/* ---- patient referrals (read-only, PHI: first name + last initial, age not DOB) ---- */
function fmtProcDate(iso){
  if(!iso) return {text:"Not booked",cls:""};
  const d=new Date(iso+"T00:00:00"),now=new Date();
  const days=Math.round((d-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
  const lbl=d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
  let rel,cls="";
  if(days<0){rel="past";cls="past";}
  else if(days===0){rel="today";cls="soon";}
  else if(days<=7){rel=`in ${days}d`;cls="soon";}
  else rel=`in ${days}d`;
  return {text:`${lbl} · ${rel}`,cls};
}

/* ---- dates (everything is compared as local YYYY-MM-DD) ---- */
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return ymd(new Date());}
function plusDays(n){const d=new Date();d.setDate(d.getDate()+n);return ymd(d);}
function dayOf(x){ if(!x) return null; return x.length<=10?x:ymd(new Date(x)); }
function daysFromToday(s){const a=new Date(s+"T00:00:00"),n=new Date();
  return Math.round((a-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/86400000);}
function fmtDay(s,opts){return new Date(s+"T00:00:00").toLocaleDateString("en-AU",opts||{day:"numeric",month:"short"});}
function relDay(s){
  const n=daysFromToday(s);
  if(n<0) return {text:"overdue",cls:"past"};
  if(n===0) return {text:"today",cls:"soon"};
  if(n===1) return {text:"tomorrow",cls:"soon"};
  return {text:`in ${n}d`,cls:n<=3?"soon":""};
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ---- load ---- */
async function getAll(path,h){
  let out=[],from=0;
  for(;;){
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{headers:Object.assign({},h,{"Range-Unit":"items",Range:`${from}-${from+999}`})});
    if(r.status===401){ const e=new Error("signed out"); e.auth=true; throw e; }
    if(!r.ok) throw new Error("HTTP "+r.status);
    const rows=await r.json(); out=out.concat(rows);
    if(rows.length<1000) return out;
    from+=1000;
  }
}
async function load(){
  const err=el("err"); err.textContent="";
  if(MOCKMODE){
    DATA=mockData(); el("login").style.display="none"; el("status").textContent="made-up test data";
    el("signout").style.display="none";
    if(active===null) active=AGENDA; render(); return;
  }
  const tok=await validToken();
  if(!tok){ showLogin(); return; }
  hideLogin();
  const h={apikey:SUPABASE_ANON,Authorization:"Bearer "+tok};
  try{
    const [w,i]=await Promise.all([getAll("workflow?select=*&order=sort_order",h),getAll("item?select=*&order=sort_order",h)]);
    const next={workflows:w,items:i,referrals:[],briefs:[],waiting:[],timeline:[]};
    // The rest is tolerant: if a table is missing or empty the app still works.
    const opt=async(key,path)=>{ try{ next[key]=await getAll(path,h); }catch(e){ if(e.auth) throw e; } };
    await Promise.all([
      opt("referrals","referral?select=*&order=sort_order"),
      opt("briefs","brief?select=*"),
      opt("waiting","waiting?select=*&resolved_at=is.null&order=asked_on"),
      opt("timeline","timeline?select=*&order=date.desc,id.desc"),
    ]);
    DATA=next;
  }catch(e){
    if(e.auth){ setSession(null); showLogin(); return; }
    err.textContent="Couldn't reach the database. ("+e.message+")"; return;
  }
  if(active===null) active=AGENDA;
  render();
}

/* ---- write-back. The signed-in app may change only: item.pinned, item.done_at,
        waiting.resolved_at. The database refuses anything else. ---- */
async function patchRow(table,id,body){
  if(MOCKMODE) return;
  const tok=await validToken();
  if(!tok){ showLogin(); throw new Error("not signed in"); }
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${encodeURIComponent(id)}`,
    {method:"PATCH",
     headers:{apikey:SUPABASE_ANON,Authorization:"Bearer "+tok,
              "Content-Type":"application/json",Prefer:"return=minimal"},
     body:JSON.stringify(body)});
  if(r.status===401){ setSession(null); showLogin(); throw new Error("signed out"); }
  if(!r.ok) throw new Error("HTTP "+r.status);
}
function flashErr(m){ const e=el("err"); e.textContent=m; setTimeout(()=>{ if(e.textContent===m) e.textContent=""; },6000); }
async function togglePin(it){
  const v=!it.pinned; it.pinned=v; render();
  try{ await patchRow("item",it.id,{pinned:v}); }
  catch(e){ it.pinned=!v; render(); flashErr("Couldn't save pin ("+e.message+")"); }
}
let undoTimer=null;
function hideUndo(){ el("undo").style.display="none"; if(undoTimer){clearTimeout(undoTimer);undoTimer=null;} }
/* Stamp a row (to-do done, or waiting item received) with an Undo for six seconds. */
async function stampRow(table,row,field,label){
  hideUndo();
  const stamp=new Date().toISOString();
  row[field]=stamp; render();
  el("undo-text").textContent=label;
  el("undo").style.display="flex";
  el("undo-btn").onclick=async()=>{
    hideUndo(); row[field]=null; render();
    try{ await patchRow(table,row.id,{[field]:null}); }
    catch(e){ flashErr("Undo didn't reach the database ("+e.message+")"); }
  };
  undoTimer=setTimeout(hideUndo,6000);
  try{ await patchRow(table,row.id,{[field]:stamp}); }
  catch(e){ row[field]=null; hideUndo(); render(); flashErr("Couldn't save ("+e.message+")"); }
}
function markDone(it){ return stampRow("item",it,"done_at","Done"); }
function markReceived(w){ return stampRow("waiting",w,"resolved_at","Received"); }

/* ---- helpers over the data ---- */
function project(id){return PROJECTS.find(p=>p.id===id);}
function projectOfItem(it){return WF_PROJECT[it.workflow_id]||null;}
function openItems(pid){
  return DATA.items.filter(it=>!it.done_at && (pid?projectOfItem(it)===pid:!!projectOfItem(it)));
}
function shownItems(pid){   // open items plus ones ticked a moment ago (so Undo has something to act on)
  return DATA.items.filter(it=>(pid?projectOfItem(it)===pid:!!projectOfItem(it)) && (!it.done_at || Date.now()-new Date(it.done_at)<7000));
}
function openWaiting(pid){
  return DATA.waiting.filter(w=>(!pid||w.project===pid) && (!w.resolved_at || Date.now()-new Date(w.resolved_at)<7000));
}
function waitDays(w){return -daysFromToday(w.asked_on);}
function refRows(){return (DATA.referrals||[]).filter(r=>r.stage!=="upcoming");}
function upcomingRows(){return (DATA.referrals||[]).filter(r=>r.stage==="upcoming");}
function briefOf(pid){return DATA.briefs.find(b=>b.project===pid)||null;}
function wfShort(id){const w=DATA.workflows.find(x=>x.id===id);return w?w.name.replace(/^\d+\.\s*/,""):"";}
function byDue(a,b){
  const ad=a.date?new Date(a.date).getTime():Infinity, bd=b.date?new Date(b.date).getTime():Infinity;
  return (ad-bd)||(a.sort_order-b.sort_order);
}

function lastSyncTime(){
  let max=null;
  for(const it of DATA.items){ if(it.updated_at && (!max || it.updated_at>max)) max=it.updated_at; }
  return max;
}
function lastSeen(){try{return JSON.parse(localStorage.getItem(LS_KEY))||{}}catch{return{}}}
function markSeen(pid){const s=lastSeen();s[pid]=new Date().toISOString();try{localStorage.setItem(LS_KEY,JSON.stringify(s));}catch(e){}}
function hasNew(pid){
  const s=lastSeen()[pid]||"";
  if(DATA.items.some(it=>projectOfItem(it)===pid && !it.done_at && (it.updated_at||"")>s)) return true;
  const b=briefOf(pid); if(b && (b.updated_at||"")>s) return true;
  if(pid==="work" && (DATA.referrals||[]).some(r=>(r.updated_at||"")>s)) return true;
  return false;
}

  return node;
}
function label(list,text){const g=document.createElement("div");g.className="group-label";g.textContent=text;list.appendChild(g);return g;}

/* ---- tabs ---- */
function renderTabs(){
  const t=el("tabs"); t.innerHTML="";
  const mk=(id,name)=>{
    const b=document.createElement("button");
    b.className="tab"; b.textContent=name; b.setAttribute("role","tab");
    b.setAttribute("aria-selected",active===id);
    if(id!==AGENDA && active!==id && hasNew(id)){const d=document.createElement("span");d.className="dot";b.appendChild(d);}
    b.onclick=()=>{ active=id; sub="tasks"; if(id!==AGENDA) markSeen(id); render(); window.scrollTo(0,0); };
    return b;
  };
  t.appendChild(mk(AGENDA,"This Week"));
  PROJECTS.forEach(p=>t.appendChild(mk(p.id,p.name)));
}
function renderSubtabs(){
  const s=el("subtabs"); s.innerHTML="";
  if(active===AGENDA){ s.style.display="none"; return; }
  s.style.display="flex";
  const tabs=[["tasks","Tasks",openItems(active).length],["brief","Brief",null],["timeline","Timeline",null]];
  if(active==="work" && (DATA.referrals||[]).length) tabs.push(["patients","Patients",(DATA.referrals||[]).length]);
  if(!tabs.some(x=>x[0]===sub)) sub="tasks";
  tabs.forEach(([id,name,n])=>{
    const b=document.createElement("button");
    b.className="subtab"; b.setAttribute("role","tab"); b.setAttribute("aria-selected",sub===id);
    b.innerHTML=esc(name)+(n?`<span class="n">${n}</span>`:"");
    b.onclick=()=>{ sub=id; render(); };
    s.appendChild(b);
  });
}

/* ---- This Week: pinned, chase, overdue, and everything dated in the next 7 days ---- */
function renderWeek(list){
  const t=today(), end=plusDays(7);
  const items=shownItems();
  const pinned=items.filter(it=>it.pinned).sort(byDue);
  const chase=openWaiting().filter(w=>waitDays(w)>=CHASE_DAYS).sort((a,b)=>a.asked_on<b.asked_on?-1:1);
  const rows=[];
  items.filter(it=>!it.pinned && it.date && dayOf(it.date)<=end).forEach(it=>rows.push({day:dayOf(it.date),item:it}));
  const prepFor=ev=>{const b=briefOf(ev.project);return !!(b&&b.meeting&&b.meeting.date===ev.date&&ev.kind==="meeting");};
  DATA.timeline.filter(ev=>ev.kind!=="event" && ev.date>=t && ev.date<=end).forEach(ev=>rows.push({day:ev.date,ev:ev,prep:prepFor(ev)}));
  DATA.briefs.forEach(b=>{   // a pinned meeting brief with no matching timeline line still shows
    const m=b.meeting;
    if(m && m.date && m.date>=t && m.date<=end && !rows.some(r=>r.ev&&r.ev.project===b.project&&r.ev.kind==="meeting"&&r.ev.date===m.date))
      rows.push({day:m.date,ev:{project:b.project,date:m.date,title:m.title,kind:"meeting",time:m.time},prep:true});
  });
  rows.sort((a,b)=>a.day<b.day?-1:a.day>b.day?1:(a.item?0:1)-(b.item?0:1));
  if(!pinned.length && !chase.length && !rows.length){
    list.innerHTML=`<div class="empty">Nothing pinned, nothing to chase, nothing due in the next 7 days.<br>Enjoy it.</div>`; return;
  }
  const tagOf=it=>{const p=project(projectOfItem(it));return p?p.name:"";};
  if(pinned.length){ label(list,"✦ Pinned"); pinned.forEach(it=>list.appendChild(itemEl(it,tagOf(it)))); }
  if(chase.length){ label(list,"Chase (no reply for 7 days or more)"); chase.forEach(w=>list.appendChild(chaseEl(w))); }
  let last="";
  rows.forEach(r=>{
    const key=r.day<t?"Overdue":(r.day===t?"Today · ":"")+fmtDay(r.day,{weekday:"long",day:"numeric",month:"short"});
    if(key!==last){ label(list,key); last=key; }
    list.appendChild(r.item?itemEl(r.item,tagOf(r.item)):eventEl(r.ev,r.prep));
  });
}

/* ---- project: Tasks ---- */
function renderTasks(list,pid){
  const p=project(pid);
  const items=shownItems(pid).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||byDue(a,b));
  if(!items.length){ list.innerHTML=`<div class="empty">No open to-dos in ${esc(p.name)}.</div>`; return; }
  items.forEach(it=>list.appendChild(itemEl(it,p.wf.length>1?wfShort(it.workflow_id):"")));
}

/* ---- project: Brief ---- */
function upcomingFor(pid){
  const t=today(), out=[];
  DATA.timeline.filter(ev=>ev.project===pid && ev.date>=t).forEach(ev=>out.push({date:ev.date,title:ev.title}));
  openItems(pid).filter(it=>it.date && dayOf(it.date)>=t).forEach(it=>out.push({date:dayOf(it.date),title:it.title}));
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function sec(list,title,html,cls){
  const d=document.createElement("div"); d.className="bsec"+(cls?" "+cls:"");
  d.innerHTML=`<h3>${esc(title)}</h3>${html}`; list.appendChild(d); return d;
}
function renderBrief(list,pid){
  const b=briefOf(pid), t=today();
  // pinned meeting brief (kept until the day after the meeting)
  const m=b&&b.meeting;
  if(m && m.date && m.date>=plusDays(-1)){
    const r=relDay(m.date);
    let h=`<div class="mtitle">${esc(m.title)}</div>
      <div class="mwhen">${esc(fmtDay(m.date,{weekday:"long",day:"numeric",month:"short"}))}${m.time?" · "+esc(m.time):""} · ${m.date<t?"yesterday":r.text}</div>`;
    if((m.questions||[]).length) h+=`<h4>Ask</h4><ul>${m.questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ul>`;
    if((m.likely_questions||[]).length) h+=`<h4>If asked</h4>`+m.likely_questions.map(x=>
      `<div class="qa"><div class="q">${esc(x.q)}</div><div>${esc(x.a)}</div></div>`).join("");
    h+=`<h4>Notes afterwards</h4><div class="notes">${m.notes?esc(m.notes):`<span style="color:var(--ink-faint)">Tell Claude what was said after the call. Claude adds the to-dos and updates this brief.</span>`}</div>`;
    sec(list,"Meeting brief",h,"meeting");
  }
  // where it stands
  let st=b&&b.standing?`<p>${esc(b.standing)}</p>`:`<p class="none">No brief written yet.</p>`;
  if(pid==="work"){
    const a=refRows().length, u=upcomingRows().length;
    if(a||u) st+=`<div class="count">${a} referral${a===1?"":"s"} to call · ${u} upcoming patient${u===1?"":"s"}</div>`;
  }
  sec(list,"Where it stands",st);
  // next actions
  const acts=(b&&b.next_actions)||[];
  sec(list,"Next actions",acts.length?`<ol>${acts.slice(0,3).map(a=>`<li>${esc(a)}</li>`).join("")}</ol>`:`<p class="none">None listed.</p>`);
  // waiting on
  const ws=openWaiting(pid).sort((a,b)=>a.asked_on<b.asked_on?-1:1);
  const wsec=sec(list,"Waiting on",ws.length?"":`<p class="none">Nothing outstanding from anyone.</p>`);
  ws.forEach(w=>{
    const days=waitDays(w), chase=days>=CHASE_DAYS;
    const row=document.createElement("div"); row.className="brow"; if(w.resolved_at) row.style.opacity=".45";
    row.innerHTML=`<div>
        <div class="who">${esc(w.person)}${chase?`<span class="chasetag">chase</span>`:""}</div>
        <div class="what">${esc(w.what)}</div>
        <div class="since${chase?" chase":""}">asked ${esc(fmtDay(w.asked_on))} · ${days===0?"today":days+" day"+(days===1?"":"s")+" ago"}</div>
      </div>
      <div class="actions"><button class="circle done" title="Received" aria-label="Mark received">✓</button></div>`;
    row.querySelector(".circle.done").onclick=()=>markReceived(w);
    wsec.appendChild(row);
  });
  // upcoming dates
  const up=upcomingFor(pid).slice(0,6);
  sec(list,"Upcoming dates",up.length?up.map(u=>
    `<div class="drow"><span class="d">${esc(fmtDay(u.date))}</span><span class="t">${esc(u.title)}</span></div>`).join(""):`<p class="none">No dates on file.</p>`);
  // last updated
  const u=document.createElement("div"); u.className="updated";
  if(b&&b.updated_at){
    const d=dayOf(b.updated_at), age=-daysFromToday(d);
    u.textContent=`Brief updated ${fmtDay(d,{day:"numeric",month:"short",year:"numeric"})}`+(age>STALE_DAYS?` · ${age} days ago, may be out of date`:"");
    if(age>STALE_DAYS) u.classList.add("stale");
  }
  list.appendChild(u);
}

/* ---- project: Timeline (upcoming above Today, past below) ---- */
function tlEl(r){
  const node=document.createElement("div");
  node.className="tl"+(r.up?" up":"")+(r.over?" over":"")+" k-"+r.kind;
  const tag=r.kind==="event"?"":r.kind==="todo"?"to-do":r.kind;
  node.innerHTML=`<div class="d">${esc(fmtDay(r.date))}</div>
    <div class="b"><div class="t">${esc(r.title)}${tag?`<span class="tag">${esc(tag)}</span>`:""}</div>
    ${r.source?`<div class="s">${esc(r.source)}</div>`:""}</div>`;
  return node;
}
function renderTimeline(list,pid){
  list.classList.add("tight");
  const t=today(), rows=[];
  DATA.timeline.filter(ev=>ev.project===pid).forEach(ev=>rows.push({date:ev.date,title:ev.title,kind:ev.kind||"event",source:ev.source}));
  const overdue=[];
  openItems(pid).filter(it=>it.date).forEach(it=>{
    const d=dayOf(it.date), r={date:d,title:it.title,kind:"todo",source:it.source};
    if(d<t){ r.over=true; overdue.push(r); } else rows.push(r);
  });
  const up=rows.filter(r=>r.date>=t).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);     // furthest first
  const past=rows.filter(r=>r.date<t).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);   // newest first
  if(!up.length && !past.length && !overdue.length){
    list.innerHTML=`<div class="empty">Nothing on this timeline yet.</div>`; return;
  }
  if(up.length) label(list,"Upcoming");
  up.forEach(r=>{ r.up=true; list.appendChild(tlEl(r)); });
  const tl=document.createElement("div"); tl.className="todayline";
  tl.textContent="Today · "+fmtDay(t,{weekday:"short",day:"numeric",month:"short"});
  list.appendChild(tl);
  if(overdue.length){
    label(list,"Overdue to-dos");
    overdue.sort((a,b)=>a.date<b.date?-1:1).forEach(r=>list.appendChild(tlEl(r)));
  }
  let last="";
  past.forEach(r=>{
    const key=fmtDay(r.date,{month:"long",year:"numeric"});
    if(key!==last){ label(list,key); last=key; }
    list.appendChild(tlEl(r));
  });
  if(up.length>7) setTimeout(()=>tl.scrollIntoView({block:"center"}),60);
}

/* ---- Work: Patients (referrals to call, then upcoming patients) ---- */
function renderPatients(list){
  const refs=refRows().slice().sort((a,b)=>a.sort_order-b.sort_order);
  const ups=upcomingRows().slice().sort((a,b)=>{
    const ad=a.procedure_date?new Date(a.procedure_date+"T00:00:00"):Infinity;
    const bd=b.procedure_date?new Date(b.procedure_date+"T00:00:00"):Infinity;
    return (ad-bd)||(a.sort_order-b.sort_order);
  });
  if(!refs.length && !ups.length){ list.innerHTML=`<div class="empty">No patient referrals.</div>`; return; }
  if(refs.length){ label(list,"Referrals to call"); refs.forEach(r=>list.appendChild(refEl(r))); }
  if(ups.length){ label(list,"Upcoming patients"); ups.forEach(r=>list.appendChild(refEl(r))); }
}

function render(){
  const sync=lastSyncTime();
  el("stamp").textContent=sync
    ?"Synced "+new Date(sync).toLocaleString("en-AU",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})
    :"Not yet synced";
  renderTabs(); renderSubtabs();
  const list=el("list"); list.innerHTML=""; list.className="list";
  if(active===AGENDA) return renderWeek(list);
  if(sub==="brief") return renderBrief(list,active);
  if(sub==="timeline") return renderTimeline(list,active);
  if(sub==="patients") return renderPatients(list);
  renderTasks(list,active);
}
